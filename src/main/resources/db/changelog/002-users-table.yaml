databaseChangeLog:
  - changeSet:
      id: 002-create-users-table
      author: sri
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tenant_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: password_hash
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
  - changeSet:
      id: 002b-users-tenant-fk
      author: sri
      changes:
        - addForeignKeyConstraint:
            baseTableName: users
            baseColumnNames: tenant_id
            referencedTableName: tenants
            referencedColumnNames: id
            constraintName: fk_users_tenant
  - changeSet:
      id: 002c-users-unique-tenant-email
      author: sri
      changes:
        - addUniqueConstraint:
            tableName: users
            columnNames: tenant_id, email
            constraintName: uq_users_tenant_email
